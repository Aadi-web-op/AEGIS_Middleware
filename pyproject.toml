[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-middleware"
version = "0.1.0"
description = "Uncertainty middleware: decides whether an AI answer should be returned, caveated, escalated or withheld."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
