# Providers are tried in order. A provider whose API-key variable is not set is skipped.
# Model names change often, so look up current ones in each provider's docs
# (for Ollama, run `ollama list` to see what you have pulled).
chain:
  - name: groq
    base_url: https://api.groq.com/openai/v1
    model: REPLACE_WITH_GROQ_MODEL
    api_key_env: GROQ_API_KEY
    timeout_s: 20

  - name: ollama
    base_url: http://localhost:11434/v1
    model: REPLACE_WITH_LOCAL_MODEL
    timeout_s: 120
    